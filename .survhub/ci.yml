# Runs on ServerHoster (in Docker on the VPS), not GitHub Actions.
# Replaces .github/workflows/ci.yml (gitleaks, ruff, boot smoke + pytest).
# Triggers: pushes to main and pull requests into main.
#
# GitHub ran MySQL 8.0 as a service container. ServerHoster jobs get one
# container and no root, so the job runs MySQL 8.0 itself: the official
# generic Linux build (cached in /cache) with its data directory in /tmp.
image: python:3.12-bookworm
timeoutMinutes: 30
memoryMb: 4096
cpus: 2
env:
  # Sandbox mode: relaxes prod-only guards (SECRET_KEY, secure cookies, ...).
  SANDBOX: "1"
  MYSQL_HOST: "127.0.0.1"
  MYSQL_PORT: "3307"
  MYSQL_USER: "fm"
  MYSQL_PASSWORD: "fm"
  MYSQL_DB: "futurematch_sandbox"
  # Force idempotent enterprise-table creation regardless of the sync-TTL stamp.
  ENTERPRISE_TABLE_SYNC_FORCE: "1"
  # Skip the slow import-time RAG warmup; it warms lazily on first chat call.
  AI_WARMUP_ON_IMPORT: "0"
  MYSQL_VERSION: "8.0.44"
  GITLEAKS_VERSION: "8.30.1"
steps:
  # Scans the commits this push or pull request adds, like gitleaks-action did.
  # Not the whole history: it still holds purged credentials (see .gitleaks.toml).
  - name: Secret scan (gitleaks)
    run: |
      GL=/cache/gitleaks-$GITLEAKS_VERSION/gitleaks
      if [ ! -x "$GL" ]; then
        mkdir -p "$(dirname "$GL")"
        curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C "$(dirname "$GL")" gitleaks
      fi
      git fetch --quiet --no-tags --depth=200 origin main:refs/remotes/origin/main
      git fetch --quiet --no-tags --deepen=200 origin "$(git rev-parse HEAD)"
      if git merge-base --is-ancestor HEAD origin/main; then
        # A push to main: scan what this commit brought in (a merge against its first parent).
        RANGE="-1 -m --first-parent HEAD"
      else
        RANGE="origin/main..HEAD"
      fi
      echo "Scanning: git log $RANGE"
      "$GL" git --config .gitleaks.toml --log-opts="$RANGE" --redact --verbose --no-banner .
  - name: Install
    run: |
      python -m venv /tmp/venv
      /tmp/venv/bin/pip install --upgrade pip
      /tmp/venv/bin/pip install -r requirements.txt
      # Test runner (not a runtime dependency, so not in requirements.txt).
      /tmp/venv/bin/pip install pytest pytest-timeout pytest-cov ruff
  # Real bugs only: syntax errors, undefined names (see ruff.toml).
  - name: Lint (ruff)
    run: /tmp/venv/bin/ruff check .
  - name: Start MySQL
    run: |
      M=/cache/mysql-$MYSQL_VERSION-linux-glibc2.17-x86_64-minimal
      AIO=/cache/libaio
      if [ ! -x "$M/bin/mysqld" ]; then
        curl -fsSL "https://downloads.mysql.com/archives/get/p/23/file/mysql-$MYSQL_VERSION-linux-glibc2.17-x86_64-minimal.tar.xz" | tar -xJ -C /cache
      fi
      if [ ! -e "$AIO/usr/lib/x86_64-linux-gnu/libaio.so.1" ]; then
        curl -fsSL -o /tmp/libaio.deb http://deb.debian.org/debian/pool/main/liba/libaio/libaio1_0.3.113-4_amd64.deb
        dpkg-deb -x /tmp/libaio.deb "$AIO"
      fi
      export LD_LIBRARY_PATH="$AIO/usr/lib/x86_64-linux-gnu"
      "$M/bin/mysqld" --no-defaults --initialize-insecure --datadir=/tmp/mysql --basedir="$M" --log-error=/tmp/mysql-init.err
      setsid "$M/bin/mysqld" --no-defaults --datadir=/tmp/mysql --basedir="$M" --port=3307 \
        --bind-address=127.0.0.1 --socket=/tmp/mysql.sock --mysqlx=OFF \
        --pid-file=/tmp/mysql.pid --log-error=/tmp/mysql.err </dev/null >/dev/null 2>&1 &
      for i in $(seq 1 30); do
        if "$M/bin/mysqladmin" --no-defaults -h127.0.0.1 -P3307 -uroot ping --silent 2>/dev/null; then
          echo "MySQL is up"
          break
        fi
        echo "Waiting for MySQL... ($i/30)"
        sleep 2
      done
      /tmp/venv/bin/python - <<'PY'
      import pymysql
      conn = pymysql.connect(host="127.0.0.1", port=3307, user="root", password="")
      with conn.cursor() as cur:
          cur.execute("ALTER USER 'root'@'localhost' IDENTIFIED BY 'rootpw'")
          cur.execute("CREATE DATABASE futurematch_sandbox")
          cur.execute("CREATE USER 'fm'@'%' IDENTIFIED BY 'fm'")
          cur.execute("GRANT ALL PRIVILEGES ON futurematch_sandbox.* TO 'fm'@'%'")
          cur.execute("SELECT VERSION()")
          print("MySQL", cur.fetchone()[0])
      conn.close()
      PY
  - name: Boot smoke test (create_app)
    run: /tmp/venv/bin/python -c "from run import create_app; create_app()"
  # Includes the fresh-database bootstrap test (tests/test_schema_baseline.py).
  - name: Run pytest suite
    run: /tmp/venv/bin/python -m pytest -q --timeout=120 --cov=. --cov-report=term
  # Best-effort, as on GitHub: prints /readyz, never fails the job.
  - name: Readiness capability check (/readyz, best-effort)
    run: |
      timeout 120 /tmp/venv/bin/python - <<'PY' || echo "readyz probe did not finish (best-effort, ignored)"
      from run import create_app
      app = create_app()
      client = app.test_client()
      resp = client.get("/readyz")
      print("GET /readyz ->", resp.status_code)
      print(resp.get_data(as_text=True)[:2000])
      PY
