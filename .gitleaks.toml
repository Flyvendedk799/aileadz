# gitleaks configuration for aileadz
#
# Secret scanning is ENABLED with gitleaks' built-in ruleset and NO allowlist.
# (S-1.1: the former run.py / run_history.txt allowlist was removed once the
# hardcoded credentials left the working tree. The old values still sit in git
# history until it is purged -- see docs/USER_ACTIONS_PART_A.md and
# docs/runbooks/GIT_HISTORY_PURGE.md. A full-history scan will therefore keep
# reporting those historic findings until the purge is done; scans of new
# commits are clean.)
#
# Never embed a secret literal in this file: that would itself be a finding.

[extend]
useDefault = true

# False positive: order_service.py passes keyword arguments
# (`dedupe_key=dedupe_key, dedupe_hours=...`) that the generic-api-key rule reads
# as a key assignment. No secret is involved. Scoped to that file and rule only.
[[allowlists]]
description = "order_service notify_roles dedupe_key kwargs (generic-api-key false positive)"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^order_service\.py$''']
regexes = ['''dedupe_key\s*=\s*dedupe_key''']
