# Lint gate for CI. Deliberately narrow: real bugs (syntax errors, undefined names,
# invalid comparisons, redefinitions) plus dead code (unused imports/variables).
# Style rules are NOT enforced - the code base predates the linter. Widen the rule
# set as the backlog is worked off.
line-length = 140
target-version = "py312"
extend-exclude = ["node_modules", "sandbox", ".claude", "migrations/versions/0001_baseline.py"]

[lint]
select = ["E9", "F63", "F7", "F82", "F811", "F401", "F841"]
