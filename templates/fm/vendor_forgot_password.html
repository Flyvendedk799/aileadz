<!DOCTYPE html>
<html lang="da" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Glemt adgangskode · Leverandørportal · Futurematch</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='futurematch/assets/fm.css') }}?v=14" />
  <style>
    body { min-height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center;
           background: var(--fm-bg); color: var(--fm-ink); font-family: 'Hanken Grotesk', system-ui, sans-serif; padding: 24px; }
    .vp-card { width: 100%; max-width: 420px; background: var(--fm-surface, #fff); border: 1px solid var(--fm-line);
               border-radius: 16px; padding: 32px 28px; }
    .vp-title { font-size: 22px; font-weight: 700; margin: 0 0 6px; }
    .vp-sub { color: var(--fm-ink-2); font-size: 13.5px; margin-bottom: 20px; }
    .vp-input { width: 100%; box-sizing: border-box; padding: 11px 13px; border: 1px solid var(--fm-line-2); border-radius: 10px; font-size: 14px; }
    .vp-btn { width: 100%; margin-top: 14px; padding: 12px; border: none; border-radius: 10px; background: var(--fm-primary); color: #fff; font-weight: 700; cursor: pointer; }
    .vp-ok { background: var(--fm-primary-tint); color: var(--fm-primary-700); padding: 12px 14px; border-radius: 10px; font-size: 13.5px; }
    .vp-foot { margin-top: 18px; font-size: 12.5px; text-align: center; }
    .vp-foot a { color: var(--fm-primary); text-decoration: none; }
  </style>
</head>
<body data-page="vendor-forgot">
  <div class="vp-card">
    <h1 class="vp-title">Glemt adgangskode</h1>
    {% if sent %}
    <div class="vp-ok"><i class="fa-solid fa-envelope-circle-check"></i> Hvis e-mailen findes hos os, har vi sendt et link til at vælge en ny adgangskode. Linket virker i én time.</div>
    {% else %}
    <p class="vp-sub">Skriv den e-mail, din leverandørkonto er oprettet med, så sender vi et link.</p>
    <form method="POST" action="{{ url_for('vendor.vendor_forgot_password') }}">
      <input class="vp-input" type="email" name="email" placeholder="navn@firma.dk" required autofocus />
      <button class="vp-btn" type="submit">Send link</button>
    </form>
    {% endif %}
    <div class="vp-foot"><a href="{{ url_for('vendor.vendor_login') }}">Tilbage til log ind</a></div>
  </div>
</body>
</html>
