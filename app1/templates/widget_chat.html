<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ widget.widget_title or 'Chat' }}</title>
    <style>
        :root {
            --widget-primary: {{ widget.theme_primary_color or '#265b47' }};
            --widget-text: {{ widget.theme_text_color or '#FFFFFF' }};
            --widget-bg: {{ widget.theme_bg_color or '#FFFFFF' }};
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--widget-bg);
            color: #1e293b;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Header ── */
        .chat-header {
            background: var(--widget-primary);
            color: var(--widget-text);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chat-header-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chat-header-icon svg {
            width: 18px;
            height: 18px;
            stroke: var(--widget-text);
        }
        .chat-header-title {
            font-size: 0.95rem;
            font-weight: 700;
        }
        .chat-header-close {
            background: none;
            border: none;
            color: var(--widget-text);
            cursor: pointer;
            padding: 4px;
            opacity: 0.7;
            transition: opacity 0.15s;
        }
        .chat-header-close:hover { opacity: 1; }
        .chat-header-close svg {
            width: 18px;
            height: 18px;
        }

        /* ── Messages Area ── */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: var(--widget-bg);
            scroll-behavior: smooth;
        }
        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-track { background: transparent; }
        .chat-messages::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        /* Message rows */
        .msg-row {
            display: flex;
            gap: 8px;
            max-width: 100%;
            animation: msgIn 0.25s ease;
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg-row.bot-row { align-items: flex-start; }
        .msg-row.user-row { justify-content: flex-end; }

        .bot-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--widget-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .bot-avatar svg {
            width: 14px;
            height: 14px;
            stroke: var(--widget-text);
        }

        .bot-bubble {
            background: color-mix(in srgb, var(--widget-primary) 7%, white);
            color: #1e293b;
            padding: 10px 14px;
            border-radius: 14px 14px 14px 4px;
            font-size: 0.85rem;
            line-height: 1.5;
            max-width: 85%;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        .bot-bubble p { margin: 0 0 0.5em 0; }
        .bot-bubble p:last-child { margin-bottom: 0; }
        .bot-bubble strong { font-weight: 700; }
        .bot-bubble em { font-style: italic; }
        .bot-bubble a {
            color: var(--widget-primary);
            text-decoration: underline;
        }
        .bot-bubble ul, .bot-bubble ol {
            margin: 0.3em 0;
            padding-left: 1.2em;
        }
        .bot-bubble li { margin: 0.15em 0; }

        .user-bubble {
            background: var(--widget-primary);
            color: var(--widget-text);
            padding: 10px 14px;
            border-radius: 14px 14px 4px 14px;
            font-size: 0.85rem;
            line-height: 1.5;
            max-width: 85%;
            word-wrap: break-word;
        }

        /* Product cards */
        .product-card-container {
            max-width: 90%;
        }
        .product-card-container :first-child {
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        /* Typing indicator */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 10px 14px;
            background: color-mix(in srgb, var(--widget-primary) 7%, white);
            border-radius: 14px 14px 14px 4px;
            width: fit-content;
        }
        .typing-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #94a3b8;
            animation: typingBounce 1.2s ease-in-out infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.15s; }
        .typing-dot:nth-child(3) { animation-delay: 0.3s; }
        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-4px); opacity: 1; }
        }

        /* Suggestion chips */
        .suggestion-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }
        .suggestion-chip {
            background: #fff;
            border: 1px solid #e2e8f0;
            color: #475569;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.78rem;
            cursor: pointer;
            transition: all 0.15s;
            max-width: 100%; overflow-wrap: anywhere; text-align: left;
        }
        .suggestion-chip:hover {
            background: var(--widget-primary);
            color: var(--widget-text);
            border-color: var(--widget-primary);
        }

        /* ── Input Area ── */
        .chat-input-area {
            border-top: 1px solid #e2e8f0;
            padding: 10px 12px;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            background: var(--widget-bg);
            flex-shrink: 0;
        }
        .chat-input {
            min-width: 0; flex: 1;
            border: 1px solid #aab7ae;
            border-radius: 20px;
            padding: 8px 14px;
            font-size: 16px;
            outline: none;
            resize: none;
            max-height: 80px;
            line-height: 1.4;
            font-family: inherit;
            background: #fff;
            transition: border-color 0.15s;
        }
        .chat-input:focus {
            border-color: var(--widget-primary);
        }
        .chat-input::placeholder {
            color: #636e69;
        }
        .send-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--widget-primary);
            border: none;
            color: var(--widget-text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: opacity 0.15s, transform 0.15s;
            opacity: 0.5;
        }
        .send-btn.active {
            opacity: 1;
        }
        .send-btn:hover.active { transform: scale(1.05); }
        .send-btn svg {
            width: 16px;
            height: 16px;
        }
        .send-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .branding [data-chat-id-copy] {
            padding: 4px 8px; border: 0; border-radius: 6px;
            color: #4e5d55; background: transparent; font: inherit; cursor: pointer;
        }
        .branding [data-chat-id-copy]:enabled:hover { background: #eef3ef; }
        .branding [data-chat-id-copy]:disabled { opacity: .6; cursor: default; }

        /* ── Branding ── */
        .branding {
            text-align: center;
            padding: 4px 0 6px;
            font-size: 0.65rem;
            color: #636e69;
            background: var(--widget-bg);
            flex-shrink: 0;
        }
        .branding a {
            color: #636e69;
            text-decoration: none;
        }
        .branding a:hover {
            color: #64748b;
        }

        /* ── UI Card (info-only in widget) ── */
        .ui-card-widget {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 0.82rem;
            color: #475569;
            max-width: 90%;
        }

        :focus-visible { outline: 2px solid var(--widget-primary); outline-offset: 2px; }
        .chat-header-close:focus-visible { outline-color: var(--widget-text); }
        @media (prefers-reduced-motion: reduce) {
            .msg-row, .typing-indicator span { animation: none; }
            .chat-messages { scroll-behavior: auto; }
        }
        /* Tenant overrides */
        {{ widget.custom_css or '' }}
    </style>
</head>
<body>
    <!-- Header -->
    <div class="chat-header">
        <div class="chat-header-left">
            {% if tenant_logo %}
            <img src="{{ tenant_logo }}" alt="" style="height:32px;width:32px;object-fit:contain;border-radius:6px;margin-right:8px;">
            {% else %}
            <div class="chat-header-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
            </div>
            {% endif %}
            <div>
                <h1 class="chat-header-title">{{ widget.widget_title or 'Chat' }}</h1>
            </div>
        </div>
        <button class="chat-header-close" onclick="window.parent.postMessage({type:'widget-close'},'*')" title="Luk">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
    </div>

    <!-- Messages -->
    <div class="chat-messages" id="chatMessages">
        {% if widget.welcome_message %}
        <div class="msg-row bot-row">
            <div class="bot-avatar">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
            </div>
            <div class="bot-bubble">{{ widget.welcome_message }}</div>
        </div>
        {% endif %}
    </div>

    <!-- Branding -->
    {% if widget.show_branding %}
    <div class="branding">
        {% if widget.show_branding %}
        <a href="https://futurematch.dk" target="_blank" rel="noopener">{{ widget.powered_by_text or 'Powered by Futurematch' }}</a>
        {% endif %}
    </div>
    {% endif %}

    <!-- Input -->
    <form class="chat-input-area" id="chatForm">
        <textarea class="chat-input" id="chatInput" aria-label="Besked til rådgiveren" placeholder="Skriv en besked..." rows="1"></textarea>
        <button class="send-btn" type="submit" id="sendBtn" disabled aria-label="Send besked" title="Send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        </button>
    </form>

    <div class="branding">
      <button type="button" data-chat-id-copy data-chat-scope="widget" disabled><span data-chat-id-label>Kopiér chat-id</span></button>
    </div>
    <script src="{{ url_for('static', filename='futurematch/assets/chat-debug.js') }}?v={{ asset_version('futurematch/assets/chat-debug.js') if asset_version is defined else 1 }}"></script>
    <script src="{{ url_for('static', filename='futurematch/assets/ai-stream.js') }}"></script>
    <script>
    (function() {
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const ASK_URL = '/app1/widget/{{ widget.widget_token }}/ask';
        const WIDGET_SESSION = {{ (widget_session or '')|tojson }};
        let isSending = false;

        // ── Dependency-free HTML sanitizer ──
        // Agent/assistant HTML (markdown-rendered text, product cards, ui_card
        // messages) is inserted via innerHTML and originates from the model, so
        // it must be sanitized to neutralise XSS: drop dangerous elements,
        // strip on* handlers + style/srcdoc, and block javascript:/data:text/html
        // URLs — same allowlist approach as static/futurematch/assets/chat.js.
        const esc = (s) => String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        const FORBIDDEN_TAGS = new Set([
            'script', 'style', 'iframe', 'object', 'embed', 'link', 'meta',
            'base', 'form', 'noscript', 'template', 'frame', 'frameset', 'applet'
        ]);
        const URL_ATTRS = ['href', 'src', 'xlink:href', 'action', 'formaction', 'background', 'poster'];
        const SAFE_URL = /^(?:https?:|mailto:|tel:|ftp:|\/|#|\.|data:image\/(?:png|jpe?g|gif|webp|svg\+xml|avif))/i;

        function sanitizeNode(root) {
            const all = root.querySelectorAll('*');
            for (let i = all.length - 1; i >= 0; i--) {
                const el = all[i];
                const tag = (el.tagName || '').toLowerCase();
                if (FORBIDDEN_TAGS.has(tag)) { el.remove(); continue; }
                const attrs = Array.prototype.slice.call(el.attributes || []);
                for (const attr of attrs) {
                    const name = (attr.name || '').toLowerCase();
                    const val = attr.value || '';
                    if (name.startsWith('on')) { el.removeAttribute(attr.name); continue; }
                    if (name === 'style') { el.removeAttribute(attr.name); continue; }
                    if (name === 'srcdoc') { el.removeAttribute(attr.name); continue; }
                    if (URL_ATTRS.indexOf(name) !== -1) {
                        const normalized = val.replace(/[\x00-\x1f\x7f\s]+/g, '').toLowerCase();
                        if (/^(?:javascript|vbscript):/i.test(normalized) || /^data:text\/html/i.test(normalized)) {
                            el.removeAttribute(attr.name);
                            continue;
                        }
                        if (normalized && !SAFE_URL.test(normalized) && !SAFE_URL.test(val.trim())) {
                            el.removeAttribute(attr.name);
                        }
                    }
                }
            }
            return root;
        }

        function sanitizeHtml(html) {
            const str = String(html == null ? '' : html);
            if (!str) return '';
            if (window.DOMPurify && typeof window.DOMPurify.sanitize === 'function') {
                try { return window.DOMPurify.sanitize(str, { FORBID_TAGS: ['style'] }); } catch (e) {}
            }
            try {
                const tpl = document.createElement('template');
                tpl.innerHTML = str;  // inert parse: no scripts run, no resources load
                sanitizeNode(tpl.content);
                return tpl.innerHTML;
            } catch (e) {
                return esc(str);
            }
        }

        // ── Auto-resize textarea ──
        function autoResize() {
            chatInput.style.height = 'auto';
            chatInput.style.height = Math.min(chatInput.scrollHeight, 80) + 'px';
        }

        function updateSendBtn() {
            sendBtn.disabled = isSending || !chatInput.value.trim();
            sendBtn.classList.toggle('active', !sendBtn.disabled);
        }

        chatInput.addEventListener('input', () => { autoResize(); updateSendBtn(); });
        chatInput.form.addEventListener('submit', (e) => {
            e.preventDefault();
            sendMessage();
        });
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
                e.preventDefault();
                sendMessage();
            }
        });

        // ── Scroll to bottom ──
        function scrollBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // ── Simple markdown rendering ──
        function renderMarkdown(text) {
            let html = text
                // Bold: **text** or __text__
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/__(.+?)__/g, '<strong>$1</strong>')
                // Italic: *text* or _text_
                .replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, '<em>$1</em>')
                .replace(/(?<!_)_(?!_)(.+?)(?<!_)_(?!_)/g, '<em>$1</em>')
                // Links: [text](url)
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
                // Unordered lists
                .replace(/^[\-\*] (.+)$/gm, '<li>$1</li>')
                // Ordered lists
                .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
                // Line breaks
                .replace(/\n/g, '<br>');

            // Wrap consecutive <li> in <ul>
            html = html.replace(/((?:<li>.*?<\/li>(?:<br>)?)+)/g, function(match) {
                const cleaned = match.replace(/<br>/g, '');
                return '<ul>' + cleaned + '</ul>';
            });

            // Paragraphs (double line break)
            html = html.replace(/<br><br>/g, '</p><p>');
            if (!html.startsWith('<')) html = '<p>' + html;
            if (!html.endsWith('>')) html += '</p>';

            return html;
        }

        // ── Parse suggestions from response ──
        function extractSuggestions(text) {
            const match = text.match(/<suggestions>\s*(\[.*?\])\s*<\/suggestions>/s);
            if (match) {
                try {
                    const suggestions = JSON.parse(match[1]);
                    const cleanText = text.replace(/<suggestions>.*?<\/suggestions>/s, '').trim();
                    return { text: cleanText, suggestions };
                } catch(e) {}
            }
            return { text, suggestions: [] };
        }

        // ── Add user message ──
        function addUserMsg(text) {
            const row = document.createElement('div');
            row.className = 'msg-row user-row';
            const bubble = document.createElement('div');
            bubble.className = 'user-bubble';
            bubble.textContent = text;
            row.appendChild(bubble);
            chatMessages.appendChild(row);
            scrollBottom();
        }

        // ── Add bot row ──
        function addBotRow() {
            const row = document.createElement('div');
            row.className = 'msg-row bot-row';

            const avatar = document.createElement('div');
            avatar.className = 'bot-avatar';
            avatar.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>';

            const content = document.createElement('div');
            content.style.display = 'flex';
            content.style.flexDirection = 'column';
            content.style.gap = '6px';
            content.style.maxWidth = '85%';

            row.appendChild(avatar);
            row.appendChild(content);
            chatMessages.appendChild(row);
            return content;
        }

        // ── Add typing indicator ──
        function addTypingIndicator(container) {
            const typing = document.createElement('div');
            typing.className = 'typing-indicator';
            typing.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
            container.appendChild(typing);
            scrollBottom();
            return typing;
        }

        // ── Render suggestion chips ──
        function renderSuggestions(suggestions, container) {
            if (!suggestions || suggestions.length === 0) return;
            const chipsDiv = document.createElement('div');
            chipsDiv.className = 'suggestion-chips';
            suggestions.forEach(s => {
                const chip = document.createElement('button');
                chip.className = 'suggestion-chip';
                chip.textContent = s;
                chip.addEventListener('click', () => {
                    if (isSending) return;
                    chipsDiv.remove();
                    sendMessage(s);
                });
                chipsDiv.appendChild(chip);
            });
            container.appendChild(chipsDiv);
            scrollBottom();
        }

        // ── Send message ──
        async function sendMessage(suggestion) {
            const query = (suggestion || chatInput.value).trim();
            if (!query || isSending) return;
            isSending = true;

            addUserMsg(query);
            if (!suggestion) {
                chatInput.value = '';
                autoResize();
            }
            updateSendBtn();

            const botContent = addBotRow();
            const typing = addTypingIndicator(botContent);

            let fullText = '', textEl = null;
            await FMAI.ask(ASK_URL, {query:query}, {
                text: function (data) {
                    typing.remove();
                    if (!textEl) { textEl=document.createElement('div'); textEl.className='bot-bubble'; botContent.appendChild(textEl); }
                    fullText += data.content || ''; textEl.innerHTML = sanitizeHtml(renderMarkdown(extractSuggestions(fullText).text)); scrollBottom();
                },
                suggestions: function (data) { renderSuggestions(data.items || [],botContent); },
                product: function (data) { typing.remove(); const el=document.createElement('div'); el.className='product-card-container'; el.innerHTML=sanitizeHtml(data.html); botContent.appendChild(el); scrollBottom(); },
                ui_card: function (data) { const el=document.createElement('div'); el.className='ui-card-widget'; el.innerHTML=sanitizeHtml(data.message || ''); botContent.appendChild(el); },
                notice: function (data) { const el=document.createElement('p'); el.textContent=data.content || ''; botContent.appendChild(el); },
                error: function (data) { typing.remove(); const el=document.createElement('p'); el.textContent=data.content; el.setAttribute('role','alert'); botContent.appendChild(el); scrollBottom(); },
                done: function () { typing.remove(); isSending=false; }
            }, {headers:{'X-Widget-Session':WIDGET_SESSION}});

            isSending = false;
            updateSendBtn();
        }

        // ── Focus input on load ──
        chatInput.focus();
    })();
    </script>
</body>
</html>
